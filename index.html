<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Onchain Verify DApp</title>
    <!-- Ethers.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; max-width: 600px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .section { margin-bottom: 25px; padding: 15px; border: 1px solid #e1e4e8; border-radius: 6px; }
        button { background-color: #4F46E5; color: white; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { background-color: #4338CA; }
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: bold; font-size: 13px; }
        .status { margin-top: 10px; font-size: 14px; color: #555; }
    </style>
</head>
<body>

    <h2>Base Onchain Verify DApp</h2>

    <!-- Cüzdan Bağlantı Bölümü -->
    <div class="section">
        <h3>1. Cüzdan Bağlantısı</h3>
        <button id="connectWalletBtn">MetaMask'i Bağla</button>
        <p class="status" id="walletStatus">Cüzdan bağlı değil.</p>
    </div>

    <!-- Kontrat Katılım Bölümü -->
    <div class="section">
        <h3>2. Kontrata Katılım (Participate)</h3>
        
        <!-- Otomatik Test Verisi Üret Butonu -->
        <button id="generateTestBtn" type="button" style="background-color: #10B981; margin-bottom: 15px;">🧪 Otomatik Test Verisi Üret ve Doldur</button>

        <form id="participateForm">
            <label for="expirationInput">Expiration (Zaman Aşımı):</label>
            <input type="text" id="expirationInput" placeholder="Örn: 1780000000">

            <label for="identityHashInput">Identity Hash (Kimlik Hash'i):</label>
            <input type="text" id="identityHashInput" placeholder="0x...">

            <label for="signatureInput">Signature (İmza):</label>
            <input type="text" id="signatureInput" placeholder="0x...">

            <button type="submit" style="background-color: #2563EB;">Katılımı Onayla (Participate)</button>
        </form>
    </div>

    <script>
        // Kontrat Bilgileri (Kendi kontrat adresini ve ABI'ni buraya ekleyebilirsin)
        const contractAddress = "SENIN_KONTRAT_ADRESIN"; 
        const contractABI = [
            "function participate(uint256 expiration, bytes32 identityHash, bytes calldata signature) external"
        ];

        let provider, signer, contract;

        document.getElementById('connectWalletBtn').addEventListener('click', async () => {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    document.getElementById('walletStatus').innerText = "Cüzdan bağlandı: " + address;
                } catch (err) {
                    console.error(err);
                    alert("Cüzdan bağlantısı reddedildi.");
                }
            } else {
                alert("Lütfen MetaMask yükleyin!");
            }
        });

        // Otomatik Test Verisi Üretme Butonu İşlevi
        document.getElementById('generateTestBtn').addEventListener('click', async () => {
            try {
                if (!window.ethereum) {
                    alert("Lütfen önce MetaMask'i bağlayın!");
                    return;
                }
                
                const prov = new ethers.providers.Web3Provider(window.ethereum);
                await prov.send("eth_requestAccounts", []);
                const sgn = prov.getSigner();
                const participantAddress = await sgn.getAddress();
                
                const expiration = Math.floor(Date.now() / 1000) + 3600; // 1 saat sonra
                const identityHash = ethers.utils.keccak256(
                    ethers.utils.defaultAbiCoder.encode(["address"], [participantAddress])
                );
                
                const messageHash = ethers.utils.solidityKeccak256(
                    ["uint256", "bytes32", "address"],
                    [expiration, identityHash, participantAddress]
                );
                
                const signature = await sgn.signMessage(ethers.utils.arrayify(messageHash));
                
                // Form alanlarını otomatik doldur
                document.getElementById('expirationInput').value = expiration;
                document.getElementById('identityHashInput').value = identityHash;
                document.getElementById('signatureInput').value = signature;
                
                alert("Test verileri başarıyla üretildi ve dolduruldu!");
            } catch (err) {
                console.error(err);
                alert("İmza üretilirken bir hata oluştu: " + (err.message || err));
            }
        });

        // Kontrat Fonksiyonunu Çağırma (ENS Bypass Edilmiş Güvenli Sürüm)
        document.getElementById('participateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!window.ethereum) {
                alert("Lütfen önce MetaMask'i bağlayın!");
                return;
            }

            const expiration = document.getElementById('expirationInput').value;
            const identityHash = document.getElementById('identityHashInput').value;
            const signature = document.getElementById('signatureInput').value;

            try {
                // ENS network hatasını tamamen engellemek için doğrudan güncel signer kullanılıyor
                const customProvider = new ethers.providers.Web3Provider(window.ethereum);
                await customProvider.send("eth_requestAccounts", []);
                const customSigner = customProvider.getSigner();

                const contractWithSigner = new ethers.Contract(contractAddress, contractABI, customSigner);
                const tx = await contractWithSigner.participate(expiration, identityHash, signature);
                
                alert("İşlem gönderildi! Onay bekleniyor...");
                await tx.wait();
                alert("İşlem başarıyla onaylandı ve tamamlandı! 🎉");
            } catch (err) {
                console.error(err);
                alert("İşlem başarısız oldu: " + (err.reason || err.message));
            }
        });
    </script>
</body>
</html>
