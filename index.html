<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Onchain Verify Test</title>
    <!-- Ethers.js kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { background: #0052ff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background: #0040cc; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .status { margin-top: 10px; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Cüzdan Bağlantısı</h2>
        <button id="connectWalletBtn">MetaMask'i Bağla</button>
        <div class="status" id="walletStatus">Cüzdan bağlı değil</div>
    </div>

    <div class="card">
        <h2>Kontrata Katılım (Participate)</h2>
        <label>Expiration (Zaman Aşımı / Süre):</label>
        <input type="text" id="expirationInput" placeholder="Örn: 1800000000">
        
        <label>Identity Hash (Kimlik Hash'i):</label>
        <input type="text" id="identityHashInput" placeholder="0x...">
        
        <label>Signature (İmza):</label>
        <input type="text" id="signatureInput" placeholder="0x...">

        <button id="participateBtn">Katılımı Onayla (Participate)</button>
        <div class="status" id="txStatus"></div>
    </div>

    <script>
        // Deploy ettiğimiz kontrat adresi
        const CONTRACT_ADDRESS = "0xc8a24bdbaE9f1B529690F148c7717b19F1bA4c59";
        
        // Eklediğin güncel ABI
        const CONTRACT_ABI = [
          {
            "inputs": [
              {
                "internalType": "address",
                "name": "_signerRegistry",
                "type": "address"
              },
              {
                "internalType": "address",
                "name": "_provider",
                "type": "address"
              },
              {
                "internalType": "bytes",
                "name": "_conditions",
                "type": "bytes"
              }
            ],
            "stateMutability": "nonpayable",
            "type": "constructor"
          },
          {
            "anonymous": false,
            "inputs": [
              {
                "indexed": true,
                "internalType": "bytes32",
                "name": "identityHash",
                "type": "bytes32"
              },
              {
                "indexed": true,
                "internalType": "address",
                "name": "wallet",
                "type": "address"
              }
            ],
            "name": "Participated",
            "type": "event"
          },
          {
            "inputs": [],
            "name": "conditions",
            "outputs": [
              {
                "internalType": "bytes",
                "name": "",
                "type": "bytes"
              }
            ],
            "stateMutability": "view",
            "type": "function"
          },
          {
            "inputs": [
              {
                "internalType": "bytes32",
                "name": "",
                "type": "bytes32"
              }
            ],
            "name": "hasParticipated",
            "outputs": [
              {
                "internalType": "bool",
                "name": "",
                "type": "bool"
              }
            ],
            "stateMutability": "view",
            "type": "function"
          },
          {
            "inputs": [
              {
                "internalType": "uint256",
                "name": "expiration",
                "type": "uint256"
              },
              {
                "internalType": "bytes32",
                "name": "identityHash",
                "type": "bytes32"
              },
              {
                "internalType": "bytes",
                "name": "signature",
                "type": "bytes"
              }
            ],
            "name": "participate",
            "outputs": [],
            "stateMutability": "nonpayable",
            "type": "function"
          },
          {
            "inputs": [],
            "name": "policyHash",
            "outputs": [
              {
                "internalType": "bytes32",
                "name": "",
                "type": "bytes32"
              }
            ],
            "stateMutability": "view",
            "type": "function"
          },
          {
            "inputs": [],
            "name": "provider",
            "outputs": [
              {
                "internalType": "address",
                "name": "",
                "type": "address"
              }
            ],
            "stateMutability": "view",
            "type": "function"
          },
          {
            "inputs": [],
            "name": "signerRegistry",
            "outputs": [
              {
                "internalType": "address",
                "name": "",
                "type": "address"
              }
            ],
            "stateMutability": "view",
            "type": "function"
          }
        ];

        let provider, signer, contract;

        document.getElementById('connectWalletBtn').addEventListener('click', async () => {
            if (window.ethereum) {
                try {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById('walletStatus').innerText = `Bağlı Cüzdan: ${address}`;
                    document.getElementById('connectWalletBtn').innerText = "Bağlandı";
                    
                    // Kontratı tanımla
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                } catch (error) {
                    console.error(error);
                    alert("Cüzdan bağlama hatası!");
                }
            } else {
                alert("Lütfen MetaMask yükleyin!");
            }
        });

        document.getElementById('participateBtn').addEventListener('click', async () => {
            if (!contract) {
                alert("Önce cüzdanınızı bağlayın!");
                return;
            }

            const expiration = document.getElementById('expirationInput').value;
            const identityHash = document.getElementById('identityHashInput').value;
            const signature = document.getElementById('signatureInput').value;
            const txStatus = document.getElementById('txStatus');

            try {
                txStatus.innerText = "İşlem cüzdana gönderiliyor...";
                const tx = await contract.participate(expiration, identityHash, signature);
                txStatus.innerText = `İşlem gönderildi, onay bekleniyor... Hash: ${tx.hash}`;
                
                await tx.wait();
                txStatus.innerText = "İşlem başarıyla onaylandı ve tamamlandı! 🎉";
            } catch (error) {
                console.error(error);
                txStatus.innerText = `Hata: ${error.message || error}`;
            }
        });
    </script>
</body>
</html>
